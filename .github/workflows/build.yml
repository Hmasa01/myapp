name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev
          pip install buildozer cython
      - name: Install Build Tools and Aidl
        run: |
          mkdir -p $HOME/.buildozer/android/platform/android-sdk/build-tools/37.0.0
          wget -q https://dl.google.com/android/repository/build-tools_r37-linux.zip -O /tmp/bt.zip
          unzip -o /tmp/bt.zip -d $HOME/.buildozer/android/platform/android-sdk/
          find $HOME/.buildozer/platform/android-sdk -name "aidl" -exec chmod +x {} \;
          find $HOME/.buildozer/platform/android-sdk -name "aidl" -exec sudo ln -sf {} /usr/local/bin/aidl \;
      - name: Build APK
        run: buildozer android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: myapp-apk
          path: bin/*.apk
